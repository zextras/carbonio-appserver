# Carbonio Appserver directories
# See tmpfiles.d(5) for format

d /opt/zextras/cache - zextras zextras
d /opt/zextras/data/mailboxd 0755 zextras zextras
d /opt/zextras/incoming - zextras zextras

# /opt/zextras/mailboxd and /opt/zextras/jetty are symlinks to jetty_base
z /opt/zextras/jetty_base 0755 zextras zextras

d /opt/zextras/jetty_base/common 0755 zextras zextras
d /opt/zextras/jetty_base/etc 0755 zextras zextras
d /opt/zextras/jetty_base/logs 0755 zextras zextras
d /opt/zextras/jetty_base/webapps 0755 zextras zextras
d /opt/zextras/jetty_base/work 0755 zextras zextras

# Log file must exist with zextras ownership before systemd unit starts
# (StandardError=append: opens file as root before user switching)
f /opt/zextras/log/zmmailboxd.out 0644 zextras zextras

z /opt/zextras/cache/* 0755 zextras zextras
z /opt/zextras/conf/antisamy.xml 0644 zextras zextras
z /opt/zextras/conf/owasp_policy.xml 0644 zextras zextras
z /opt/zextras/db/*.sql 0444 zextras zextras
z /opt/zextras/db/*.sql.in 0444 zextras zextras
z /opt/zextras/db/db.sql 0440 zextras zextras
z /opt/zextras/db/db.sql.in 0440 zextras zextras
z /opt/zextras/incoming/* 0755 zextras zextras

# Jetty common libs - use real path to avoid unsafe path transition
z /opt/zextras/jetty_base/common/endorsed 0755 root root
z /opt/zextras/jetty_base/common/lib 0755 root root
z /opt/zextras/jetty_base/common/lib/*.jar 0444 root root

# Jetty etc files - use real path
z /opt/zextras/jetty_base/etc/jetty.xml* 0640 zextras zextras
z /opt/zextras/jetty_base/etc/keystore 0640 zextras zextras
z /opt/zextras/jetty_base/etc/mailboxd.* 0640 zextras zextras
z /opt/zextras/jetty_base/etc/service.web.xml.in 0640 zextras zextras

z /opt/zextras/lib/ext/*/*.jar 0444 root root
z /opt/zextras/lib/jars/* 0444 root root
z /opt/zextras/lib/lib*.so 0755 root root

Z /opt/zextras/conf/templates - zextras zextras
Z /opt/zextras/conf/templates_custom - zextras zextras
Z /opt/zextras/db - zextras zextras
Z /opt/zextras/incoming - zextras zextras
Z /opt/zextras/mailbox - zextras zextras
